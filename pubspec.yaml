name: network_tools_flutter
description: Extended features of network_tools package for flutter framework supporting iOS and Android
version: 3.0.6
issue_tracker: https://github.com/osociety/network_tools_flutter/issues
repository: https://github.com/osociety/network_tools_flutter

environment:
  sdk: ">=3.10.0 <4.0.0"
  # Flutter 3.38 is the first stable release with Dart 3.10.
  flutter: ">=3.38.0"

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  
topics:
  - network
  - ping
  - arp
  - port
  - scanner

funding:
  - https://liberapay.com/OpenSociety/donate
  - https://ko-fi.com/fs0c13ty

dependencies:
  flutter:
    sdk: flutter
  
  # Multi-platform network ping utility.
  dart_ping: ^10.0.1
  flutter_isolate: ^2.1.0
  # Debugging and error logging.
  logging: ^1.3.0
  get_it: ^9.2.1
  # Pinned to the 6.0 line: configure_flutter imports core internals.
  network_tools: ">=6.0.11 <6.1.0"
  universal_io: ^2.2.2
  meta: ^1.11.0
  # nsd 5 requires Flutter 3.41; stay on the tested 4.x line.
  nsd: ">=4.0.4 <5.0.0"
  # Performing mDNS queries (e.g. Bonjour, Avahi).
  multicast_dns: ^0.3.2+7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=3.0.1 <7.0.0"
  fake_http_client: ">=1.0.0 <3.0.0"
  nsd_platform_interface: ^2.1.1

flutter:
